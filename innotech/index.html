<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>(주)이노테크 안내</title>
<!-- QR 하나로 홈페이지·리플렛·영상을 안내한다.
     링크가 바뀌면 이 파일의 주소만 고치면 되고, 명패·스티커는 그대로 쓴다.
     홍보영상 링크가 정해지면 VIDEO_URL 자리에 넣고 아래 영상 버튼의 hidden 을 지운다. -->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  background: #f4f5f7; color: #1c1e21; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  display: flex; justify-content: center; padding: 28px 16px 48px;
}
.wrap { width: 100%; max-width: 420px; }
.head { text-align: center; margin-bottom: 22px; }
.logo {
  display: inline-flex; align-items: center; justify-content: center;
  width: 62px; height: 62px; border-radius: 16px;
  background: #1A3E8F; color: #fff; font-size: 26px; font-weight: 800;
  letter-spacing: -1px; margin-bottom: 10px;
}
h1 { font-size: 22px; font-weight: 800; }
.tag { font-size: 13.5px; color: #5f6672; margin-top: 4px; }

.card {
  display: block; text-decoration: none; color: inherit;
  background: #fff; border: 1px solid #e3e6ea; border-radius: 14px;
  padding: 16px 18px; margin-bottom: 11px;
  display: flex; align-items: center; gap: 14px;
}
.card:active { transform: scale(0.99); }
.ico {
  flex: 0 0 44px; height: 44px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center; font-size: 21px;
  background: #EFF6FF;
}
.card.primary .ico { background: #1A3E8F; }
.t { flex: 1; min-width: 0; }
.t b { display: block; font-size: 16px; font-weight: 700; }
.t span { font-size: 12.5px; color: #5f6672; }
.arrow { color: #9aa1ac; font-size: 18px; }

.note {
  margin-top: 18px; font-size: 12px; color: #8a919c; text-align: center; line-height: 1.7;
}
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="logo">IT</div>
    <h1>(주)이노테크</h1>
    <p class="tag">신뢰성 환경시험 장비 · 디스플레이 검사장비</p>
  </div>

  <a class="card primary" href="http://www.innotech2013.com">
    <div class="ico">🏠</div>
    <div class="t"><b>홈페이지</b><span>제품 라인업 · 회사 소개 · 문의</span></div>
    <div class="arrow">›</div>
  </a>

  <a class="card" href="innotech-leaflet.pdf" download="이노테크_리플렛.pdf">
    <div class="ico">📄</div>
    <div class="t"><b>리플렛 다운로드</b><span>A4 6페이지 · PDF 2.7MB</span></div>
    <div class="arrow">↓</div>
  </a>

  <!-- 홍보영상: 링크가 정해지면 href 를 채우고 hidden 을 지운다 -->
  <a class="card" id="video" href="VIDEO_URL" hidden>
    <div class="ico">▶️</div>
    <div class="t"><b>회사 홍보영상</b><span>재생하기</span></div>
    <div class="arrow">›</div>
  </a>

  <p class="note">
    QR로 접속하셨습니다. 필요한 항목을 눌러 주세요.
  </p>

</div>
</body>
</html>
